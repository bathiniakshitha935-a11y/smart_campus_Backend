spring.application.name=smart-campus-backend

# LOCAL DEVELOPMENT: H2 file database. No PostgreSQL setup is needed to run in IntelliJ.
spring.datasource.url=jdbc:h2:file:./smart_campus_local;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true

server.port=${PORT:8080}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.security.jwt-expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
